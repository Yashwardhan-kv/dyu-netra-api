<!--meta: Contact | Dyunetra | Get in touch with Dyunetra about cybersecurity, blockchain, AI, IT consulting, MEVONU, QEVRAXIS or DevAI. | contact | contact -->
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow rv">// Contact</p>
    <h1 class="rv" data-d="1">Open a <span class="grad">secure channel.</span></h1>
    <p class="lead rv" data-d="2">Tell us what you are working on. A real person reads every message.</p>
  </div>
</section>

<section>
  <div class="wrap contact-grid">
    <aside class="panel rv">
      <span class="idx">DIRECT LINES</span>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/></svg>
        <div><small>Email</small><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></div>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div><small>Response time</small><span>Within 1&ndash;2 business days</span></div>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-7 8-7s7 2 8 7"/></svg>
        <div><small>Founder</small><a href="https://www.linkedin.com/in/yashwardhan-devalyst" target="_blank" rel="noopener noreferrer">Yashwardhan Katkamwar on LinkedIn</a></div>
      </div>
    </aside>

    <div class="panel rv" data-d="1">
      <form id="contact-form" novalidate>
        <div class="two">
          <div class="f"><label for="name">Name</label><input id="name" name="name" type="text" maxlength="100" autocomplete="name" required></div>
          <div class="f"><label for="email">Email</label><input id="email" name="email" type="email" maxlength="150" autocomplete="email" required></div>
        </div>
        <div class="two">
          <div class="f"><label for="org">Organisation</label><input id="org" name="org" type="text" maxlength="120" autocomplete="organization"></div>
          <div class="f"><label for="interest">I am interested in</label>
            <select id="interest" name="interest">
              <option value="General enquiry">General enquiry</option>
              <option>IT Consulting</option><option>Cybersecurity</option><option>Blockchain</option><option>Artificial Intelligence</option>
              <option value="MEVONU">MEVONU</option><option value="QEVRAXIS">QEVRAXIS</option><option value="DevAI">DevAI</option>
            </select>
          </div>
        </div>
        <div class="f"><label for="message">Message</label><textarea id="message" name="message" maxlength="4000" required></textarea></div>
        <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <input type="hidden" name="ts" value="">
        <button class="btn" type="submit">Transmit message <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <div class="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>
